name: Construir APK

# Se dispara a mano desde la pestaña Actions, o al publicar una etiqueta v1.0.0, v1.1.0…
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Correr las pruebas
        run: npx jest

      - name: Generar el proyecto nativo
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Compilar el APK de release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Renombrar el APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NOMBRE="MisFinanzas-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NOMBRE"
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$NOMBRE"

      - name: Publicarlo como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: ${{ steps.apk.outputs.nombre }}
          retention-days: 30

      # En una etiqueta v* crea la Release definitiva; a mano actualiza la de "ultimo".
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ETIQUETA="${{ github.ref_name }}"
            TITULO="Mis Finanzas ${{ github.ref_name }}"
            EXTRA=""
          else
            ETIQUETA="ultimo"
            TITULO="Mis Finanzas — última compilación"
            EXTRA="--prerelease"
          fi

          NOTAS=$(cat <<TXT
          APK instalable de **Mis Finanzas** v${{ steps.apk.outputs.version }}.

          **Cómo instalarlo**
          1. Descarga \`${{ steps.apk.outputs.nombre }}\` desde el celular Android.
          2. Ábrelo. Android pedirá permitir "instalar apps de fuentes desconocidas": acéptalo.
          3. Listo. La app funciona sin internet y sin crear cuenta.

          Requiere Android 8 (API 26) o superior.

          Compilado desde el commit \`${{ github.sha }}\`.
          TXT
          )

          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release upload "$ETIQUETA" "${{ steps.apk.outputs.nombre }}" --clobber
            gh release edit "$ETIQUETA" --title "$TITULO" --notes "$NOTAS"
          else
            gh release create "$ETIQUETA" "${{ steps.apk.outputs.nombre }}" \
              --title "$TITULO" --notes "$NOTAS" $EXTRA
          fi
